<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso TurnosPrimark</title>
  <style>
    :root {
      --primark-blue: #00AEDB;
      --primark-dark: #1E2229;
      --primark-light: #F5F3F2;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: clamp(16px, 4vw, 32px);
      background: var(--primark-light);
    }

    .login-card {
      width: min(400px, 100%);
      padding: clamp(28px, 8vw, 40px) clamp(20px, 7vw, 30px);
      text-align: center;
      background: var(--white);
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    .logo {
      margin-bottom: 5px;
      color: var(--primark-blue);
      font-size: clamp(26px, 8vw, 30px);
      font-weight: 300;
      letter-spacing: clamp(3px, 1.2vw, 5px);
      text-transform: uppercase;
    }

    .subtitle {
      margin-bottom: 30px;
      color: var(--primark-dark);
      font-size: 13px;
      letter-spacing: 1px;
      opacity: 0.6;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--primark-dark);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      min-height: 46px;
      padding: 12px 16px;
      border: 1px solid #DCD8D6;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      border-color: var(--primark-blue);
      box-shadow: 0 0 0 3px rgba(0, 174, 219, 0.15);
    }

    button {
      width: 100%;
      min-height: 48px;
      margin-top: 10px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: var(--primark-blue);
      color: var(--white);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover { background: #0099c2; }

    .error {
      margin-top: 15px;
      color: #E74C3C;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      body { place-items: start center; }

      .login-card {
        min-height: calc(100dvh - 32px);
        display: flex;
        flex-direction: column;
        justify-content: center;
        border-radius: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      input, button { transition: none; }
    }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="logo">Primark</div>
    <div class="subtitle">Gestión de Turnos y Cuadrantes</div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" required autocomplete="email" placeholder="ejemplo@primark.com">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit">Iniciar Sesión</button>
    </form>
    <p id="mensajeError" class="error" role="alert"></p>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC-ZXBeOtmK4L31KW2xI1Biv_r2jnyLKT0",
      authDomain: "turnosprimark.firebaseapp.com",
      projectId: "turnosprimark",
      storageBucket: "turnosprimark.firebasestorage.app",
      messagingSenderId: "162804882971",
      appId: "1:162804882971:web:ee5b525065bddfd843e2be",
      measurementId: "G-Q0H4W1RJBJ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const msgError = document.getElementById("mensajeError");
      msgError.textContent = "";

      signInWithEmailAndPassword(auth, email, password)
        .then(() => { window.location.href = "cuadrante.html"; })
        .catch((err) => {
          msgError.textContent = err.code === "auth/invalid-credential"
            ? "El correo o la contraseña son incorrectos."
            : "Error de autenticación.";
        });
    });
  </script>
</body>
</html>

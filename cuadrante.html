<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Cuadrante - Primark</title>
  <style>
    :root { --p-blue: #00AEDB; --p-dark: #1E2229; --p-light: #F5F3F2; --white: #FFF; }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      padding: clamp(12px, 3vw, 20px);
      background: var(--p-light);
      color: var(--p-dark);
    }

    .container {
      width: min(800px, 100%);
      margin: 0 auto;
      padding: clamp(16px, 4vw, 30px);
      background: var(--white);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .header {
      position: relative;
      margin-bottom: 30px;
      padding-bottom: 20px;
      text-align: center;
      border-bottom: 2px solid var(--p-light);
    }

    .header h2 {
      color: var(--p-blue);
      font-size: clamp(32px, 8vw, 42px);
      font-weight: 300;
      letter-spacing: clamp(4px, 2vw, 8px);
      text-transform: uppercase;
    }

    .header h3 {
      color: var(--p-blue);
      font-size: clamp(14px, 3vw, 16px);
      font-weight: 200;
      letter-spacing: 2px;
    }

    .btn {
      min-height: 44px;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      background: var(--p-blue);
      color: var(--white);
      font-weight: 600;
      cursor: pointer;
    }

    .btn-out {
      position: absolute;
      top: 0;
      right: 0;
      min-height: 36px;
      padding: 6px 12px;
      background: #E74C3C;
      font-size: 12px;
    }

    .nav {
      display: grid;
      grid-template-columns: minmax(90px, auto) 1fr minmax(90px, auto);
      gap: 8px;
      align-items: center;
      margin-bottom: 20px;
    }

    .month-title {
      font-size: clamp(16px, 4vw, 20px);
      font-weight: 600;
      text-align: center;
      text-transform: capitalize;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: clamp(4px, 1.5vw, 8px);
      text-align: center;
    }

    .day-name {
      padding: 10px 0;
      color: #7E7C7A;
      font-size: clamp(10px, 2.5vw, 13px);
      font-weight: 600;
      text-transform: uppercase;
    }

    .day {
      min-width: 0;
      min-height: clamp(52px, 10vw, 70px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(8px, 2vw, 15px) 3px;
      border-radius: 8px;
      background: var(--p-light);
      font-size: clamp(12px, 3vw, 16px);
      font-weight: 500;
    }

    .day.empty { background: transparent; }

    .user-name {
      margin-top: 6px;
      color: var(--p-dark);
      font-size: clamp(12px, 3vw, 14px);
      font-weight: 500;
      letter-spacing: 0.5px;
      opacity: 0.7;
      overflow-wrap: anywhere;
    }

    @media (max-width: 600px) {
      .header { padding-top: 48px; }

      .btn-out {
        left: 50%;
        right: auto;
        width: fit-content;
        transform: translateX(-50%);
      }

      .nav {
        grid-template-columns: 44px 1fr 44px;
      }

      .nav .btn {
        width: 44px;
        padding: 8px 4px;
        overflow: hidden;
        font-size: 0;
      }

      #prevMonth::before { content: "◀"; font-size: 16px; }
      #nextMonth::before { content: "▶"; font-size: 16px; }

      .day-name:nth-child(1)::before { content: "L"; }
      .day-name:nth-child(2)::before { content: "M"; }
      .day-name:nth-child(3)::before { content: "X"; }
      .day-name:nth-child(4)::before { content: "J"; }
      .day-name:nth-child(5)::before { content: "V"; }
      .day-name:nth-child(6)::before { content: "S"; }
      .day-name:nth-child(7)::before { content: "D"; }
      .day-name { font-size: 12px; }
      .day-name { font-size: 0; }
      .day-name::before { font-size: 12px; }
    }

    @media (max-width: 360px) {
      body { padding: 8px; }
      .container { padding: 12px; }
      .grid { gap: 3px; }
      .day { min-height: 48px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <h2>Primark</h2>
      <h3 id="nameCenter">Cargando centro...</h3>
      <div id="userName" class="user-name">Cargando usuario...</div>
      <button class="btn btn-out" id="logoutBtn">Cerrar Sesión</button>
    </header>

    <nav class="nav" aria-label="Navegación del calendario">
      <button class="btn" id="prevMonth" aria-label="Mes anterior">◀ Anterior</button>
      <div class="month-title" id="monthYear"></div>
      <button class="btn" id="nextMonth" aria-label="Mes siguiente">Siguiente ▶</button>
    </nav>

    <div class="grid" id="weekHeaders" aria-hidden="true">
      <div class="day-name">Lun</div><div class="day-name">Mar</div><div class="day-name">Mié</div>
      <div class="day-name">Jue</div><div class="day-name">Vie</div><div class="day-name">Sáb</div><div class="day-name">Dom</div>
    </div>
    <div class="grid" id="calendarDays"></div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC-ZXBeOtmK4L31KW2xI1Biv_r2jnyLKT0",
      authDomain: "turnosprimark.firebaseapp.com",
      projectId: "turnosprimark",
      storageBucket: "turnosprimark.firebasestorage.app",
      messagingSenderId: "162804882971",
      appId: "1:162804882971:web:ee5b525065bddfd843e2be",
      measurementId: "G-Q0H4W1RJBJ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "index.html";
      } else {
        const userNameDiv = document.getElementById("userName");
        const centerDiv = document.getElementById("nameCenter");

        try {
          const q = query(collection(db, "Empleados"), where("Correo", "==", user.email));
          const querySnapshot = await getDocs(q);

          if (!querySnapshot.empty) {
            const datosEmpleado = querySnapshot.docs[0].data();
            userNameDiv.textContent = `${datosEmpleado.Nombre} ${datosEmpleado.Apellidos}`;
            centerDiv.textContent = `${datosEmpleado.Centro} ${datosEmpleado.Provincia}`;
          } else {
            userNameDiv.textContent = user.email;
          }
        } catch (error) {
          console.error("Error al obtener los datos del empleado:", error);
          userNameDiv.textContent = user.email;
        }

        renderCalendar();
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", () => signOut(auth));

    const calendarDays = document.getElementById("calendarDays");
    const monthYearTitle = document.getElementById("monthYear");
    let currentDate = new Date();

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const textoFecha = currentDate.toLocaleDateString("es-ES", { month: "long", year: "numeric" });
      monthYearTitle.textContent = textoFecha.replace(" de ", " ");

      calendarDays.innerHTML = "";

      const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
      const totalDays = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDayIndex; i++) {
        calendarDays.appendChild(Object.assign(document.createElement("div"), { className: "day empty", "aria-hidden": "true" }));
      }

      for (let day = 1; day <= totalDays; day++) {
        const dayElement = document.createElement("div");
        dayElement.className = "day";
        dayElement.textContent = day;
        dayElement.setAttribute("aria-label", `${day} de ${textoFecha}`);
        calendarDays.appendChild(dayElement);
      }
    }

    document.getElementById("prevMonth").addEventListener("click", () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });

    document.getElementById("nextMonth").addEventListener("click", () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });

    renderCalendar();
  </script>
</body>
</html>
